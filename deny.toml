# cargo-deny configuration — advisory + licence gating for the Rust dependency tree.
# Run: `cargo deny check` (advisories, licenses, bans, sources). Wired into CI.

[advisories]
version = 2
yanked = "deny"
# Avoid CI breaking on a deeply-transitive unmaintained crate we don't control.
unmaintained = "workspace"

[licenses]
version = 2
# Allow-list only — a dependency with an unlisted licence fails the build (intentional).
# RMB ships under GPL-3.0-or-later; all current deps are permissive (MIT/Apache/BSD/ISC/…).
allow = [
  "GPL-3.0-or-later", # RMB's own crates
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
