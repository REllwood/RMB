[package]
name = "rmb-data"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "RMB persistence layer: sqlx repositories over a local SQLite database"

[dependencies]
rmb-domain = { path = "../rmb-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
# Vendor SQLite into the binary so end-users need no system SQLite (offline Win/Mac distribution).
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
rust_decimal = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
